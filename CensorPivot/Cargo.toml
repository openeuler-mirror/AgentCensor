[package]
name = "censorpivot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MulanPSL-2.0"
description = "AgentCensor ingress and transaction orchestration layer"

[[bin]]
name = "censord"
path = "src/bin/censord.rs"

[dependencies]
blake3 = "1.5.5"
clap = { version = "4.5.20", features = ["derive"] }
fs2 = "0.4.3"
nix = { version = "0.30.1", features = ["process", "signal", "socket", "fs", "user"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0.18"
uuid = { version = "1.11.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.13.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
