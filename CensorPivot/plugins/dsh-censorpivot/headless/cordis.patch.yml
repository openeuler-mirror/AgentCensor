# Internal worker-side half of the CensorPivot composite.
- insert:
    - id: censorpivot-headless
      name: '@agentcensor/censorpivot-headless'
    # Tool calls can be executed by DSH's headless worker. Register the same
    # CensorFS tool surface here so /explore resolves branch_explore instead
    # of being forwarded to a worker with only the event exporter installed.
    - id: censorfs-parallel-worlds
      name: '@censorfs/deepseek-harness'
      config:
        childCommand: !!js 'process.env.DSH_CENSORFS_CHILD_COMMAND ?? "dsh-jsonrpc-agent"'
        childArgs: !!js 'process.env.DSH_CENSORFS_CHILD_CONFIG ? [process.env.DSH_CENSORFS_CHILD_CONFIG] : []'
        controlPlaneCwd: !!js 'process.env.DSH_HOME ?? process.cwd()'
        provider: !!js 'process.env.DSH_CENSORFS_PROVIDER ?? "deepseek-official"'
        model: !!js 'process.env.DSH_CENSORFS_MODEL ?? "deepseek-v4-flash"'
        maxTokens: 49152
        childEnv: !!js '({ ...(process.env.DSH_HOME ? { DSH_HOME: process.env.DSH_HOME } : {}) })'
        branch: main
        censorfsCommand: !!js 'process.env.CENSORFS_COMMAND ?? "censorfs"'
        socket: !!js 'process.env.CENSORFS_SOCKET ?? "/run/censorfs/control.sock"'
        mounterCommand: !!js 'process.env.CENSORFS_MOUNTER ?? "/usr/local/bin/censorfs-mounter"'
        mounterBin: !!js 'process.env.CENSORFS_MOUNTER_BIN ?? undefined'
        runnerReadyTimeoutMs: 10000
        inProcessMaxDepth: 1
        inProcessOnly: !!js 'process.env.CENSORFS_INPROCESS_ONLY === "1"'
        fuseOnly: !!js 'process.env.CENSORFS_FUSE_ONLY === "1"'
        runnerAuditDir: !!js 'process.env.CENSORFS_RUNNER_AUDIT_DIR'
        runnerIsolation: !!js '(() => { const v = {}; if (process.env.CENSORFS_RUNNER_ISOLATION) v.mode = process.env.CENSORFS_RUNNER_ISOLATION; if (process.env.CENSORFS_RUNNER_MINIMUM_LEVEL) v.minimumLevel = process.env.CENSORFS_RUNNER_MINIMUM_LEVEL; if (process.env.CENSORFS_RUNNER_CGROUP_ROOT) v.root = process.env.CENSORFS_RUNNER_CGROUP_ROOT; if (process.env.CENSORFS_RUNNER_CGROUP_STATE_DIR) v.stateDir = process.env.CENSORFS_RUNNER_CGROUP_STATE_DIR; return v })()'
        tmpRoot: !!js 'process.env.CENSORFS_TMP_ROOT ?? "/tmp/dsh-branch-explore"'
        validationProfiles:
          code:
            - name: tests
              command: cargo
              args: ['test', '--workspace', '--all-targets', '--locked']
              timeoutMs: 120000
              required: true
          node:
            - name: syntax-check
              command: node
              args: ['--check', 'index.js']
              timeoutMs: 15000
              required: false
          static-site:
            - name: html-smoke
              command: python3
              args: ['-c', 'from html.parser import HTMLParser; HTMLParser().feed(open("index.html", encoding="utf-8").read())']
              timeoutMs: 10000
              required: true
          python-code:
            - name: unittest
              command: python3
              args: ['-m', 'unittest', 'discover', '-v']
              timeoutMs: 30000
              required: true
          harness-config:
            - name: patch-present
              command: test
              args: ['-s', 'cordis.patch.yml']
              timeoutMs: 5000
              required: true
    - id: event-exporter
      name: '@censorfs/event-exporter'
      config:
        socket: !!js 'process.env.DSH_EVENT_SOCKET ?? ""'
        enabled: !!js 'process.env.DSH_EVENT_SOCKET ? true : false'
    - id: censorscope-host
      name: 'censorscope-host'
