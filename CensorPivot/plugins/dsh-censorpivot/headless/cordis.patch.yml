# Internal worker-side half of the CensorPivot composite.
- insert:
    - id: censorpivot-headless
      name: '@agentcensor/censorpivot-headless'
    - id: event-exporter
      name: '@censorfs/event-exporter'
      config:
        socket: !!js 'process.env.DSH_EVENT_SOCKET ?? ""'
        enabled: !!js 'process.env.DSH_EVENT_SOCKET ? true : false'
    - id: censorscope-host
      name: 'censorscope-host'
