# CensorPivot DSH composite: the existing CensorFS, CensorGuard, and CensorScope
# plugins are installed as runtime packages. This is their patch composition,
# not a merged implementation.
- insert:
    - id: censorpivot
      name: '@agentcensor/censorpivot'

    # CensorFS web runtime and UI.
    - id: censorfs-parallel-worlds
      name: '@censorfs/deepseek-harness'
      config:
        childCommand: !!js 'process.env.DSH_CENSORFS_CHILD_COMMAND ?? "dsh-jsonrpc-agent"'
        childArgs: !!js 'process.env.DSH_CENSORFS_CHILD_CONFIG ? [process.env.DSH_CENSORFS_CHILD_CONFIG] : []'
        controlPlaneCwd: !!js 'process.env.DSH_HOME ?? process.cwd()'
        provider: !!js 'process.env.DSH_CENSORFS_PROVIDER ?? "deepseek-official"'
        model: !!js 'process.env.DSH_CENSORFS_MODEL ?? "deepseek-v4-flash"'
        maxTokens: 49152
        childEnv: !!js '({ ...(process.env.DSH_HOME ? { DSH_HOME: process.env.DSH_HOME } : {}) })'
        branch: main
        censorfsCommand: !!js 'process.env.CENSORFS_COMMAND ?? "censorfs"'
        socket: !!js 'process.env.CENSORFS_SOCKET ?? "/run/censorfs/control.sock"'
        mounterCommand: !!js 'process.env.CENSORFS_MOUNTER ?? "censorfs-mounter"'
        mounterBin: !!js 'process.env.CENSORFS_MOUNTER_BIN ?? undefined'
        runnerReadyTimeoutMs: 10000
        inProcessMaxDepth: 1
        inProcessOnly: !!js 'process.env.CENSORFS_INPROCESS_ONLY === "1"'
        fuseOnly: !!js 'process.env.CENSORFS_FUSE_ONLY === "1"'
        runnerAuditDir: !!js 'process.env.CENSORFS_RUNNER_AUDIT_DIR'
        runnerIsolation: !!js '(() => { const v = {}; if (process.env.CENSORFS_RUNNER_ISOLATION) v.mode = process.env.CENSORFS_RUNNER_ISOLATION; if (process.env.CENSORFS_RUNNER_MINIMUM_LEVEL) v.minimumLevel = process.env.CENSORFS_RUNNER_MINIMUM_LEVEL; if (process.env.CENSORFS_RUNNER_CGROUP_ROOT) v.root = process.env.CENSORFS_RUNNER_CGROUP_ROOT; if (process.env.CENSORFS_RUNNER_CGROUP_STATE_DIR) v.stateDir = process.env.CENSORFS_RUNNER_CGROUP_STATE_DIR; return v })()'
        tmpRoot: !!js 'process.env.CENSORFS_TMP_ROOT ?? "/tmp/dsh-branch-explore"'
        validationProfiles:
          code:
            - name: tests
              command: cargo
              args: ['test', '--workspace', '--all-targets', '--locked']
              timeoutMs: 120000
              required: true
          node:
            - name: syntax-check
              command: node
              args: ['--check', 'index.js']
              timeoutMs: 15000
              required: false
          static-site:
            - name: html-smoke
              command: python3
              args: ['-c', 'from html.parser import HTMLParser; HTMLParser().feed(open("index.html", encoding="utf-8").read())']
              timeoutMs: 10000
              required: true
          python-code:
            - name: unittest
              command: python3
              args: ['-m', 'unittest', 'discover', '-v']
              timeoutMs: 30000
              required: true
          harness-config:
            - name: patch-present
              command: test
              args: ['-s', 'cordis.patch.yml']
              timeoutMs: 5000
              required: true
        previewProfiles:
          static-site:
            command: python3
            args: ['-m', 'http.server', '{port}', '--bind', '127.0.0.1', '--directory', '/workspace']
            ttlMs: 600000

    # CensorGuard whole-tree attach, host bridge, and UI.
    - id: censorguard-bootstrap
      name: '@censorguard/dsh/bootstrap'
      config:
        policyGroup: censorguard-dsh-default
        dshSockPath: /run/censorguard/dsh.sock
        blockOnFailure: false
    - id: censorguard-host
      name: '@censorguard/dsh/host'
      config:
        grpcAddr: 127.0.0.1:50051
        boundGroup: censorguard-dsh-default
    - id: censorguard-ui
      name: '@censorguard/dsh'

    # CensorScope host observation, per-session worker, and UI.
    - id: censorscope-host
      name: 'censorscope-host'
    - id: agentcensor-session-proxy
      name: 'agentcensor-session-proxy'
    - id: censorscope-ui
      name: 'censorscope-ui'

# Guard readiness gates. Existing inject lists are repeated because DSH patch
# replacement is field-level, not an array merge.
- id: webserver
  inject: [webStartup, censorguardReady]
- id: web-runtime
  inject: [webStartup, censorguardReady]
- id: api-gateway
  inject: [censorguardReady]
- id: cordis-host-runner
  inject: [censorguardReady]
- id: code-runtime
  inject: [censorguardReady]
- id: subprocess
  inject: [censorguardReady]
- id: tools
  inject: [censorguardReady]
- id: agent-loop
  inject: [censorguardReady]
  disabled: true

# Scope's session proxy owns web conversations and Scope UI replaces the native
# trajectory view. The worker keeps the native agent loop in its headless profile.
- id: session-title-llm
  disabled: true
- id: ui-trajectory
  disabled: true
