[package]
name = "censorprivacy"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MulanPSL-2.0"
description = "AgentCensor privacy gateway, private computation and isolated agent launcher"

[workspace]
members = []
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
overflow-checks = true
lto = "thin"
strip = "debuginfo"


[profile.dev]
debug = 0
incremental = false


[profile.test]
debug = 0
incremental = false
