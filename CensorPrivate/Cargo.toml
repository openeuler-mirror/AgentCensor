[package]
name = "censorprivacy"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MulanPSL-2.0"
description = "AgentCensor privacy gateway, private computation and isolated agent launcher"

[workspace]
members = []
resolver = "2"

[dependencies]
fancy-regex = "0.14"
getrandom = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
sha2 = "0.10"
zeroize = "1.8"

[profile.release]
overflow-checks = true
lto = "thin"
strip = "debuginfo"


[profile.dev]
debug = 0
incremental = false


[profile.test]
debug = 0
incremental = false
