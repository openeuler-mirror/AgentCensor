[package]
name = "censorprivacy"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MulanPSL-2.0"
description = "AgentCensor privacy gateway, private computation and isolated agent launcher"
default-run = "censorprivacy"

[workspace]
members = []
resolver = "2"

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "=4.5.20", features = ["derive"] }
fancy-regex = "0.14"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.2"
libc = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1.3"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "time", "process"] }
# Keep URL/IDNA compatible with the declared Rust 1.85 MSRV.
url = "=2.4.1"
zeroize = "1.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }


[profile.release]
overflow-checks = true
lto = "thin"
strip = "debuginfo"


[profile.dev]
debug = 0
incremental = false


[profile.test]
debug = 0
incremental = false
