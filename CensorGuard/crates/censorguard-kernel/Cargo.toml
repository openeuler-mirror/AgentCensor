[package]
name = "censorguard-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
censorguard-common = { path = "../censorguard-common" }
censorguard-policy = { path = "../censorguard-policy" }
thiserror.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
