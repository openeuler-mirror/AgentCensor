# 阶段 03：在文件拒绝之上增加网络拒绝。本文件可直接使用。
#
# 相对阶段 02 的变化：拒绝明文管理/传输端口的出站连接。未命中 deny 的目标默认
# 放行，22 和 443 仍按观察项上报，便于在打开网络拦截后核对业务连通性。
daemon:
  bpf_object: /usr/lib/censorguard/enforce.bpf.o
  control_socket: /run/censorguard/ctl.sock
  event_socket: /run/censorguard/events.sock
  launch_socket: /run/censorguard/launch.sock
  state_dir: /var/lib/censorguard
  socket_group: censorguard
  dsh_enabled: false
  dsh_self_groups: []
  spawn_grpc: false
  failure_mode: permissive
  self_protection: false
  enable_file: true
  enable_exec: true
  enable_net: true
  audit_file: false
  audit_exec: false
  audit_net: false
  dns_refresh_seconds: 60
rules:
  # 保留凭据文件保护
  - file deny+audit /etc/shadow
  - file deny+audit /etc/gshadow
  - file deny+audit /etc/sudoers [read]
  # 拒绝明文管理与文件传输端口
  - net deny+audit 0.0.0.0/0:23
  - net deny+audit 0.0.0.0/0:21
  # 保留执行与网络观察项
  - exec allow+audit /usr/bin/ssh
  - exec allow+audit /usr/bin/scp
  - net allow+audit 0.0.0.0/0:22
  - net allow+audit 0.0.0.0/0:443
