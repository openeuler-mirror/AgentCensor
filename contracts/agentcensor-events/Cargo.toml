[package]
name = "agentcensor-events"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR GPL-2.0-only OR MulanPSL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
