# event-exporter bundle：子进程里监听 session/event，经 Unix socket 流回父进程，
# 并反向接收父进程（FuseProvider）的控制消息（cancel / update-policy）。
# socket 路径经环境变量 DSH_EVENT_SOCKET 传入（父进程 spawn 前经 argv 透传给
# dsh-jsonrpc-agent，由它 export 成 DSH_EVENT_SOCKET）。
- insert:
    - id: event-exporter
      name: '@censorfs/event-exporter'
      config:
        socket: !!js 'process.env.DSH_EVENT_SOCKET ?? ""'
        enabled: !!js 'process.env.DSH_EVENT_SOCKET ? true : false'
