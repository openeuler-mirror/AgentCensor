[workspace]
resolver = "2"
members = [
    "crates/censorfs-core",
    "cmd/censorfsd",
    "cmd/censorfsctl",
    "cmd/censorfs-mounter",
    "cmd/censorfs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

[workspace.dependencies]
bincode = "=1.3.3"
blake3 = { version = "=1.5.5", features = ["pure"] }
clap = { version = "=4.5.20", features = ["derive"] }
crc32c = "=0.6.8"
fs2 = "=0.4.3"
hex = "=0.4.3"
parking_lot = "=0.12.3"
prost = "=0.13.3"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
thiserror = "=1.0.64"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
walkdir = "=2.5.0"

[patch.crates-io]
fuser = { path = "vendor/fuser" }
